name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/ITW.Suite.sln

      - name: Build
        run: dotnet build src/ITW.Suite.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test src/ITW.Suite.sln
          --no-build
          --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Format check
        run: dotnet format src/ITW.Suite.sln --verify-no-changes

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ./coverage
